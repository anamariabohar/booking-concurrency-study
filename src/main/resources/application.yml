spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_concurrency_study
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

concurrency:
  executor:
    core-pool-size: 8
    max-pool-size: 32
    queue-capacity: 200
